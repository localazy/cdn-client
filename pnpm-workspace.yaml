packages:
  - 'packages/*'
  - 'apps/*'

# Keep a single-document lockfile, GitHub dependency graph cannot read the pnpm 12 env document
# https://github.com/dependabot/dependabot-core/issues/15904
pmOnFail: ignore

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
minimumReleaseAgeExclude:
  - esbuild@0.24.3
  - vite@6.4.2
  - tmp@0.2.6
  - vite@6.4.3
overrides:
  '@vitest/mocker@>=5.0.0-beta.1 <5.0.3': ^5.0.3
  esbuild@<=0.24.2: ^0.24.3
  vite@<=6.4.1: ^6.4.2
